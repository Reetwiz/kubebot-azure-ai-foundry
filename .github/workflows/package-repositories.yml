name: Package repositories

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.2.1
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c dpkg-dev rpm
      - name: Import package signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          test -n "$PACKAGE_SIGNING_KEY"
          printf '%s' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
      - name: Build packages and repositories
        env:
          VERSION: ${{ inputs.release_tag }}
          PACKAGE_SIGNING_KEY_ID: ${{ vars.PACKAGE_SIGNING_KEY_ID }}
        run: |
          test -n "$PACKAGE_SIGNING_KEY_ID"
          VERSION="${VERSION#v}" ./scripts/build-linux-packages.sh
          ./scripts/build-package-repositories.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/repository
      - name: Deploy package repositories
        id: deployment
        uses: actions/deploy-pages@v4