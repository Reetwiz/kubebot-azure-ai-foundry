name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build uv
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz

  native-wheel-test:
    needs: python-artifacts
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install dist/*.whl
        shell: bash
      - run: kubebot --version

  publish:
    needs: [python-artifacts, native-wheel-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: dist
      - run: python -m pip install uv
      - name: Build native Linux packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" ./scripts/build-linux-packages.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/packages/*